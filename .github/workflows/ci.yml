name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --junitxml=report.xml

      - name: Build JSON report
        if: always()
        run: python scripts/build_report.py

      - name: Send report to local receiver
        if: always()
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST "$REPORT_URL" \
            -H "Content-Type: application/json" \
            -H "X-Report-Token: $REPORT_TOKEN" \
            -H "ngrok-skip-browser-warning: true" \
            --data @test-report.json